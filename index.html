<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Live Pinned Comments Overlay</title>

<style>
/* (your original CSS unchanged ✅) */
body {
    font-family: system-ui, sans-serif;
    background-color: #121212;
    color: #fff;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
}
.app-container { max-width: 550px; width: 100%; }
.header { display: flex; justify-content: space-between; margin-bottom: 20px; }
.status-badge { padding:6px 12px; border-radius:20px; background:#cf6679; color:#000;}
.status-badge.active { background:#03dac6; }
.pin-card { background:#1e1e1e; padding:20px; border-left:5px solid #fe2c55; border-radius:8px;}
.flash { animation:pulse-border 1s ease-out; }
@keyframes pulse-border {
    0% { box-shadow:0 0 0 0 rgba(254,44,85,0.9); }
    100% { box-shadow:0 0 0 25px rgba(254,44,85,0);}
}
.history-list { max-height:250px; overflow-y:auto;}
.history-item { padding:10px; border-bottom:1px solid #292929; }
.history-user { color:#25f4ee;}
</style>
</head>

<body>

<div class="app-container">
    <div class="header">
        <h1>TikTok Pin Monitor</h1>
        <div id="status" class="status-badge">Connecting...</div>
    </div>

    <div id="pin-card" class="pin-card">
        <div class="label">📌 Pinned Message</div>
        <div id="username">Awaiting first pin...</div>
        <div id="comment-text">Waiting for live data...</div>
    </div>

    <div class="history-section">
        <h3>Pin History</h3>
        <div id="history-list" class="history-list"></div>
    </div>
</div>

<script>
const statusBadge = document.getElementById('status');
const pinCard = document.getElementById('pin-card');
const userElement = document.getElementById('username');
const commentElement = document.getElementById('comment-text');
const historyList = document.getElementById('history-list');

let currentDisplayUser = "";
let currentDisplayComment = "";

const MAX_HISTORY = 20;

// ✅ FIXED (no localhost hardcode)
const eventSource = new EventSource('/stream-pins');

eventSource.onopen = () => {
    statusBadge.innerText = "● Live";
    statusBadge.classList.add('active');
};

eventSource.onmessage = (event) => {
    let pinnedData;

    try {
        pinnedData = JSON.parse(event.data);
    } catch (e) {
        console.error("Invalid JSON:", event.data);
        return;
    }

    console.log("New Pin:", pinnedData);

    // Save old to history
    if (currentDisplayUser) {
        const historyItem = document.createElement('div');
        historyItem.classList.add('history-item');

        historyItem.innerHTML =
            `<span class="history-user">${currentDisplayUser}</span>: "${currentDisplayComment}"`;

        historyList.insertBefore(historyItem, historyList.firstChild);

        // ✅ Limit history size
        while (historyList.children.length > MAX_HISTORY) {
            historyList.removeChild(historyList.lastChild);
        }
    }

    currentDisplayUser = '@' + pinnedData.username;
    currentDisplayComment = pinnedData.commentText;

    userElement.innerText = currentDisplayUser;
    commentElement.innerText = `"${currentDisplayComment}"`;

    // Animation reset
    pinCard.classList.remove('flash');
    void pinCard.offsetWidth;
    pinCard.classList.add('flash');
};

eventSource.onerror = () => {
    console.log("Reconnecting...");
    statusBadge.innerText = "Reconnecting...";
    statusBadge.classList.remove('active');
};
</script>

</body>
</html>
